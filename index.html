<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOPICHESS - Play Chess Online vs Stockfish</title>
  
  <!-- Tailwind CSS -->
  <script src="https://tailwindcss.com"></script>
  
  <!-- Chessboard.js CSS -->
  <link rel="stylesheet" href="https://cloudflare.com">
  
  <!-- jQuery (Required by Chessboard.js) -->
  <script src="https://jquery.com"></script>
  
  <!-- Chess.js (Rule Engine) -->
  <script src="https://cloudflare.com"></script>
  
  <!-- Chessboard.js (UI Board) -->
  <script src="https://cloudflare.com"></script>

  <style>
    body {
      background-color: #312e2b;
      color: #bababa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .white-1e1d7 { background-color: #eeeed2 !important; color: #769656; }
    .black-3c85d { background-color: #769656 !important; color: #eeeed2; }
    .highlight-move { box-shadow: inset 0 0 0 3px #f7f785 !important; }
    .sidebar-panel { background-color: #262421; }
    .nested-panel { background-color: #211f1c; }
    .active-timer { background-color: #fff !important; color: #000 !important; font-weight: bold; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #211f1c; }
    ::-webkit-scrollbar-thumb { background: #45423e; border-radius: 3px; }
    .suggested-dot {
      width: 24%; height: 24%; background: rgba(0, 0, 0, 0.15); border-radius: 50%;
      position: absolute; top: 38%; left: 38%; pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4">

  <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
    
    <!-- LEFT SIDE: Game Display Board -->
    <div class="col-span-1 lg:col-span-7 flex flex-col items-center">
      <div class="w-full max-w-[520px] flex justify-between items-center bg-[#262421] px-4 py-2 rounded-t text-sm font-semibold border-b border-[#3c3934]">
        <div class="flex items-center gap-2">
          <span id="top-player-avatar" class="w-2.5 h-2.5 rounded-full bg-gray-400"></span>
          <span id="top-player-name">Opponent (Bot)</span>
        </div>
        <div id="top-clock" class="bg-[#211f1c] px-3 py-1 rounded text-base tabular-nums transition-colors duration-200">--:--</div>
      </div>

      <div id="my-board" class="w-full max-w-[520px] shadow-2xl relative"></div>

      <div class="w-full max-w-[520px] flex justify-between items-center bg-[#262421] px-4 py-2 rounded-b text-sm font-semibold border-t border-[#3c3934]">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-green-500"></span>
          <span id="bottom-player-name">You</span>
        </div>
        <div id="bottom-clock" class="bg-[#211f1c] px-3 py-1 rounded text-base tabular-nums transition-colors duration-200">--:--</div>
      </div>
    </div>

    <!-- RIGHT SIDE: Control Panel -->
    <div class="col-span-1 lg:col-span-5 sidebar-panel rounded-lg p-4 flex flex-col justify-between h-auto lg:min-h-[580px] shadow-xl border border-[#3c3934]">
      
      <div>
        <h1 class="text-xl font-black tracking-wider text-white border-b border-[#3c3934] pb-2 mb-4 flex items-center gap-2">
          👑 TOPICHESS
        </h1>

        <div id="config-panel" class="space-y-4">
          <div class="grid grid-cols-2 gap-2 text-xs font-bold uppercase tracking-wider text-center">
            <button id="mode-bot" class="p-2.5 bg-green-600 text-white rounded transition">vs Computer</button>
            <button id="mode-local" class="p-2.5 bg-neutral-700 hover:bg-neutral-600 rounded transition text-neutral-300">Local 2P</button>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider mb-1.5 text-neutral-400">Choose Side</label>
            <div class="grid grid-cols-3 gap-2 text-sm font-semibold text-center">
              <button id="pick-white" class="py-2 rounded border-2 border-green-600 bg-[#211f1c] text-white">White</button>
              <button id="pick-random" class="py-2 rounded border border-transparent bg-neutral-800 hover:bg-neutral-700">Random</button>
              <button id="pick-black" class="py-2 rounded border border-transparent bg-neutral-800 hover:bg-neutral-700">Black</button>
            </div>
          </div>

          <div>
            <label for="time-control" class="block text-xs font-bold uppercase tracking-wider mb-1 text-neutral-400">Time Limit</label>
            <select id="time-control" class="w-full nested-panel border border-[#3c3934] text-white rounded p-2 text-sm focus:outline-none focus:border-green-600">
              <option value="none">No Time Limit (Casual)</option>
              <option value="60:0">Bullet 1 min</option>
              <option value="120:1">Bullet 2+1</option>
              <option value="180:0" selected>Blitz 3 min</option>
              <option value="300:0">Blitz 5 min</option>
              <option value="600:0">Rapid 10 min</option>
            </select>
          </div>

          <div id="bot-config-container">
            <label class="block text-xs font-bold uppercase tracking-wider mb-1.5 text-neutral-400">Computer Level Configuration</label>
            <div class="flex bg-[#211f1c] rounded p-1 mb-2 text-xs font-semibold">
              <button id="tab-presets" class="flex-1 text-center py-1.5 bg-neutral-700 rounded text-white">Presets</button>
              <button id="tab-custom" class="flex-1 text-center py-1.5 text-neutral-400 hover:text-white">Custom Slider</button>
            </div>

            <div id="view-presets">
              <select id="bot-preset" class="w-full nested-panel border border-[#3c3934] text-white rounded p-2 text-sm focus:outline-none focus:border-green-600">
                <option value="600">Martin (Beginner - 600 Elo)</option>
                <option value="1200" selected>Nelson (Intermediate - 1200 Elo)</option>
                <option value="1500">Wally (Advanced - 1500 Elo)</option>
                <option value="2000">Elena (Master - 2000 Elo)</option>
                <option value="2500">Stockfish (Grandmaster - 2500+ Elo)</option>
              </select>
            </div>

            <div id="view-custom" class="hidden space-y-1 bg-[#211f1c] p-3 rounded border border-[#3c3934]">
              <div class="flex justify-between text-xs text-neutral-300">
                <span>Adaptive strength:</span>
                <span id="slider-elo-val" class="font-bold text-green-400">1400 Elo</span>
              </div>
              <input id="bot-slider" type="range" min="400" max="2600" step="50" value="1400" class="w-full accent-green-600">
            </div>
          </div>

          <button id="start-game-btn" class="w-full py-3 bg-green-600 hover:bg-green-500 font-bold uppercase text-white rounded shadow-lg transition tracking-wide text-sm">
            Start Match
          </button>
        </div>

        <div id="active-game-panel" class="hidden space-y-4">
          <div class="flex justify-between items-center text-xs uppercase font-black text-neutral-400">
            <span>Notation Record Table</span>
            <span id="game-status-label" class="text-green-500 font-bold normal-case">Match Ongoing</span>
          </div>

          <div id="move-log" class="nested-panel rounded border border-[#3c3934] h-40 overflow-y-auto p-3 text-xs grid grid-cols-2 gap-y-1.5 gap-x-4 tabular-nums align-top text-neutral-300"></div>

          <div class="flex gap-2">
            <button id="resign-btn" class="flex-1 py-2 bg-neutral-800 hover:bg-neutral-700 text-white rounded text-xs font-bold uppercase tracking-wider transition">Resign</button>
            <button id="new-match-btn" class="flex-1 py-2 bg-neutral-800 hover:bg-neutral-700 text-white rounded text-xs font-bold uppercase tracking-wider transition">New Match</button>
          </div>
        </div>
      </div>

      <div id="engine-status" class="mt-4 border-t border-[#3c3934] pt-3 text-[11px] text-neutral-500 flex justify-between items-center">
        <span>AI State: <strong id="engine-loader" class="text-yellow-600 font-semibold">Disconnected</strong></span>
        <span id="engine-details">Pure JS Engine (CORS Proof)</span>
      </div>

    </div>
  </div>

  <script>
    let board = null;
    let game = new Chess();
    let stockfishWorker = null;
    
    let activeMode = 'bot'; 
    let preferredColor = 'white'; 
    let actualPlayerColor = 'white'; 
    
    let timeControlMode = 'none';
    let clocks = { white: 0, black: 0 };
    let timeIncrement = 0;
    let clockIntervalId = null;

    const playAudioFrequency = (freq, type, duration) => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = type;
        oscillator.frequency.value = freq;
        gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    };

    const soundEffects = {
      move: () => playAudioFrequency(800, 'triangle', 0.08),
      capture: () => playAudioFrequency(1100, 'square', 0.1),
      check: () => playAudioFrequency(550, 'sawtooth', 0.15),
      end: () => playAudioFrequency(350, 'sine', 0.3)
    };
